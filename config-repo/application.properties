eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

smartlab.jwt.secret=SmartLabJwtSecretKeyForHS256MustBe32b
smartlab.jwt.expiration-minutes=120
smartlab.penalty.daily-rate=200.00
smartlab.limits.student-active-borrows=2
smartlab.limits.engineer-active-borrows=5
smartlab.limits.student-pickup-hours=2
smartlab.limits.engineer-pickup-hours=24
