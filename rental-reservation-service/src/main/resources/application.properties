spring.application.name=rental-reservation-service
server.port=8083
spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=jdbc:mysql://localhost:3306/lab_rental_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

smartlab.penalty.daily-rate=200.00
smartlab.limits.student-active-borrows=2
smartlab.limits.engineer-active-borrows=5
smartlab.limits.student-pickup-hours=2
smartlab.limits.engineer-pickup-hours=24

resilience4j.ratelimiter.instances.reports.limit-for-period=5
resilience4j.ratelimiter.instances.reports.limit-refresh-period=20s

resilience4j.timelimiter.instances.inventory-service.timeout-duration=5s
resilience4j.circuitbreaker.instances.inventory-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventory-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventory-service.wait-duration-in-open-state=10s
